    <linearGradient id="goldGlow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  <rect width="1000" height="700" fill="url(#cyanGlow)"/>
  <rect width="1000" height="700" fill="url(#goldGlow)"/>
