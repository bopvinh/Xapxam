<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Radial and Linear Gradients -->
    <radialGradient id="crestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Ambient Light Sphere -->
  <circle cx="400" cy="300" r="280" fill="url(#crestGlow)" />

  <!-- Geometric Grid Starburst Background Lines -->
  <g stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="100" y1="300" x2="700" y2="300" />
    <line x1="400" y1="50" x2="400" y2="550" />
    <line x1="180" y1="120" x2="620" y2="480" />
    <line x1="180" y1="480" x2="620" y2="120" />
    <circle cx="400" cy="300" r="180" />
    <circle cx="400" cy="300" r="240" />
  </g>

  <!-- Hexagonal Tech Shield Outer Frame -->
  <polygon points="400,100 580,200 580,400 400,500 220,400 220,200" stroke="url(#cyanSheen)" stroke-width="3" fill="rgba(13, 17, 23, 0.65)" filter="drop-shadow(0 0 15px rgba(99,102,241,0.3))"/>

  <!-- Inner Concentric Shield -->
  <polygon points="400,130 550,215 550,385 400,470 250,385 250,215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="rgba(22, 27, 36, 0.4)"/>

  <!-- Golden Crown / Crest Symbol at Center -->
  <g transform="translate(400, 260) scale(1.6)" filter="drop-shadow(0 0 10px rgba(245,158,11,0.5))">
    <path d="M-30,20 L-40,-15 L-15,0 L0,-30 L15,0 L40,-15 L30,20 Z" fill="url(#goldSheen)" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="-40" cy="-15" r="3" fill="#fde047"/>
    <circle cx="0" cy="-30" r="4" fill="#ffffff"/>
    <circle cx="40" cy="-15" r="3" fill="#fde047"/>
  </g>

  <!-- Precision Corner Nodes -->
  <circle cx="400" cy="100" r="5" fill="#38bdf8"/>
  <circle cx="580" cy="200" r="5" fill="#38bdf8"/>
  <circle cx="580" cy="400" r="5" fill="#38bdf8"/>
  <circle cx="400" cy="500" r="5" fill="#38bdf8"/>
  <circle cx="220" cy="400" r="5" fill="#38bdf8"/>
  <circle cx="220" cy="200" r="5" fill="#38bdf8"/>
</svg>
